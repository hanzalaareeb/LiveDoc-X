[project]
name = "live-docx"
version = "0.1.0"
description = "API for authenticated document storage and intelligence"
authors = [{ name = "hanzalaareeb", email = "hanzalaareb@gmail.com" }]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dj-database-url>=3.1.2",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-redis>=7.0.0",
    "django (>=6.0,<7.0)",
    "django-ninja>=1.6.2",
    "django-ninja-jwt>=5.4.4",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "ruff==0.14.8",
]

[tool.uv]
package = false
